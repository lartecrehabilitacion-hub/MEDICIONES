<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mediciones | Lartec</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- HEADER SUPERIOR -->
    <header class="header">
        <img src="Imagenes/logo-lartec.png" alt="Logo Lartec" class="logo">
        <h1>Control de Mediciones</h1>
    </header>

    <!-- BLOQUE FORMULARIO -->
    <section class="panel">
        <h2>Agregar Medición</h2>

        <form id="medicion-form" class="form-grid">
            <input type="text" id="cliente" placeholder="Cliente" required>
            <input type="text" id="direccion" placeholder="Dirección" required>
            <input type="number" id="valor" placeholder="Valor" required>

            <button type="submit" class="btn-azul">Guardar</button>
        </form>
    </section>

    <!-- BLOQUE TABLA -->
    <section class="panel">
        <h2>Lista de Mediciones</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Dirección</th>
                    <th>Valor</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-mediciones"></tbody>
        </table>
    </section>

    <script src="app.js"></script>
</body>
</html>
